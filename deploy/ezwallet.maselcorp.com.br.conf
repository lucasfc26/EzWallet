# Host nginx vhost — copy to /etc/nginx/sites-available/ezwallet.maselcorp.com.br
# and symlink into sites-enabled. Unique server_name: does not steal location /
# from sol.salenergia, statusenergy, dj/cards/jobwatch/gsalas/unbound.maselcorp.
#
# EzWallet container binds only 127.0.0.1:27118 (see .env FRONTEND_BIND).
# After DNS A/AAAA for ezwallet.maselcorp.com.br points here:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ezwallet.maselcorp.com.br

server {
    listen 80;
    listen [::]:80;
    server_name ezwallet.maselcorp.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:27118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
