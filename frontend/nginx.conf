map $http_x_forwarded_proto $ez_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vite-plugin-singlefile inlines JS/CSS into index.html, so there are no
    # separate hashed assets to cache-bust — every route just serves it.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin from the browser's point of view: the refresh cookie is
    # SameSite=Lax and the backend's CORS allow-list only needs this origin.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ez_forwarded_proto;
    }
}
